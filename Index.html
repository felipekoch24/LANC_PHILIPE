<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar Geek - Philipe</title>
    <style>
        body { background-color: #0b0b0f; color: #f0f0f0; font-family: sans-serif; padding: 20px; }
        header { text-align: center; margin-bottom: 30px; }
        .card { background: #14141c; border-radius: 12px; overflow: hidden; margin-bottom: 30px; border: 1px solid #2a2a38; }
        video { width: 100%; display: block; }
        .content { padding: 20px; }
        h2 { color: #e50914; margin-bottom: 10px; }
    </style>
</head>
<body>

    <header>
        <h1>RADAR DE LANÇAMENTOS</h1>
    </header>

    <!-- Vingadores -->
    <div class="card">
        <video controls>
            <source src="vingadores.mp4" type="video/mp4">
        </video>
        <div class="content">
            <h2>Vingadores</h2>
        </div>
    </div>

    <!-- Kagurabachi -->
    <div class="card">
        <video controls>
            <source src="kagurabachi.mp4" type="video/mp4">
        </video>
        <div class="content">
            <h2>Kagurabachi</h2>
        </div>
    </div>

    <!-- Lanternas -->
    <div class="card">
        <video controls>
            <source src="lanternas.mp4" type="video/mp4">
        </video>
        <div class="content">
            <h2>Lanternas</h2>
        </div>
    </div>

</body>
</html>
