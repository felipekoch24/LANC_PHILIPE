<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lançamentos</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #e50914;
        }

        #lancamentos-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background-color: #1e1e1e;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        .card h3 {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #fff;
        }

        .card video {
            width: 100%;
            border-radius: 6px;
            background-color: #000;
        }

        .timer {
            font-size: 0.95rem;
            font-weight: bold;
            color: #00e676;
            background-color: #2a2a2a;
            padding: 8px 12px;
            border-radius: 4px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Próximos Lançamentos</h1>

    <div id="lancamentos-container"></div>

    <script>
        fetch('lancamentos.json')
            .then(response => response.json())
            .then(data => {
                // Inverte para os mais recentes (adicionados no fim do JSON) ficarem no topo
                data.reverse();

                const container = document.getElementById('lancamentos-container');

                data.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card';

                    card.innerHTML = `
                        <h3>${item.titulo}</h3>
                        <video src="${item.arquivo}" controls preload="metadata"></video>
                        <div class="timer"></div>
                    `;

                    container.appendChild(card);

                    // Só toca o vídeo ao clicar no play e pausa qualquer outro em execução
                    const video = card.querySelector('video');
                    video.addEventListener('play', () => {
                        document.querySelectorAll('video').forEach(otherVideo => {
                            if (otherVideo !== video) {
                                otherVideo.pause();
                            }
                        });
                    });

                    // Lógica da contagem regressiva
                    const timerElement = card.querySelector('.timer');
                    function updateTimer() {
                        let targetDate;

                        // Trata formato DD/MM/AAAA HH:MM ou AAAA-MM-DD HH:MM
                        if (item.data.includes('/')) {
                            const [datePart, timePart] = item.data.split(' ');
                            const [day, month, year] = datePart.split('/');
                            targetDate = new Date(`${year}-${month}-${day}T${timePart || '00:00'}`);
                        } else {
                            targetDate = new Date(item.data.replace(' ', 'T'));
                        }

                        const now = new Date();
                        const diff = targetDate - now;

                        if (diff <= 0) {
                            timerElement.innerHTML = "Lançado!";
                            return;
                        }

                        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
                        const days = Math.floor((diff / (1000 * 60 * 60 * 24)) % 30);
                        const months = Math.floor(diff / (1000 * 60 * 60 * 24 * 30));

                        let textoTempo = "Faltam: ";
                        if (months > 0) textoTempo += `${months}m `;
                        if (days > 0 || months > 0) textoTempo += `${days}d `;
                        textoTempo += `${hours}h`;

                        timerElement.innerHTML = textoTempo;
                    }

                    updateTimer();
                    setInterval(updateTimer, 1000);
                });
            })
            .catch(error => console.error('Erro ao carregar os lançamentos:', error));
    </script>

</body>
</html>
