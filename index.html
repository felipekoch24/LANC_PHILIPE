<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar Geek - Philipe</title>
    <style>
        body { background-color: #0b0b0f; color: #f0f0f0; font-family: sans-serif; padding: 20px; }
        header { text-align: center; margin-bottom: 30px; }
        .card { background: #14141c; border-radius: 12px; overflow: hidden; margin-bottom: 30px; border: 1px solid #2a2a38; }
        video { width: 100%; display: block; }
        .content { padding: 20px; }
        h2 { color: #e50914; margin-bottom: 10px; }
    </style>
</head>
<body>

    <header>
        <h1>LANÇAMENTOS</h1>
    </header>

    <!-- Onde os cards vão aparecer automaticamente -->
    <div id="feed-container"></div>

    <script>
        fetch('lancamentos.json')
            .then(response => response.json())
            .then(videos => {
                const container = document.getElementById('feed-container');
                
                videos.forEach(item => {
                    const cardDiv = document.createElement('div');
                    cardDiv.className = 'card';
                    
                    cardDiv.innerHTML = `
                        <video controls playsinline>
                            <source src="${item.arquivo}" type="video/mp4">
                            Seu navegador não suporta vídeos.
                        </video>
                        <div class="content">
                            <h2>${item.titulo}</h2>
                        </div>
                    `;
                    
                    container.appendChild(cardDiv);
                });
            })
            .catch(error => console.error('Erro ao carregar os lançamentos:', error));
    </script>

</body>
</html>
