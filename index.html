<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Próximos Lançamentos</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            padding: 20px;
        }

        /* --- TELA DE PERFIL (INÍCIO) --- */
        #profile-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 90vh;
            gap: 20px;
        }

        #profile-screen h1 {
            color: #e50914;
            font-size: 2.5rem;
        }

        .profile-card {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 400px;
        }

        .avatar-container {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #e50914;
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .label-secao {
            font-size: 0.85rem;
            color: #aaa;
            text-align: center;
            width: 100%;
            margin-top: -5px;
        }

        /* Avatar Padrão (presave.png) */
        .preset-avatars {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .preset-avatars img {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            object-fit: cover;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.2s;
        }

        .preset-avatars img:hover {
            border-color: #00e676;
            transform: scale(1.05);
        }

        /* Botão estilizado para abrir arquivos do celular */
        .btn-galeria {
            background-color: #2a2a2a;
            color: #fff;
            border: 1px dashed #666;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            width: 100%;
            text-align: center;
            transition: 0.2s;
        }

        .btn-galeria:hover {
            background-color: #333;
            border-color: #e50914;
        }

        .profile-card input[type="text"] {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: #fff;
            text-align: center;
            font-size: 1.1rem;
        }

        .btn-entrar {
            background-color: #e50914;
            color: #fff;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .btn-entrar:hover {
            background-color: #b20710;
        }

        /* --- TELA DE LANÇAMENTOS --- */
        #app-screen {
            display: none;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto 25px auto;
        }

        .user-greeting {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #1e1e1e;
            padding: 8px 15px;
            border-radius: 30px;
        }

        .user-greeting img {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            object-fit: cover;
        }

        .btn-trocar {
            background: transparent;
            border: 1px solid #bbbbbb;
            color: #bbbbbb;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .btn-trocar:hover {
            border-color: #fff;
            color: #fff;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #e50914;
        }

        #lancamentos-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background-color: #1e1e1e;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        .card h3 {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #fff;
        }

        .card video {
            width: 100%;
            border-radius: 6px;
            background-color: #000;
        }

        .data-lancamento {
            font-size: 0.85rem;
            color: #bbbbbb;
            text-align: center;
            font-weight: 500;
        }

        .timer {
            font-size: 0.95rem;
            font-weight: bold;
            color: #00e676;
            background-color: #2a2a2a;
            padding: 8px 12px;
            border-radius: 4px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- TELA 1: SELEÇÃO DE PERFIL -->
    <div id="profile-screen">
        <h1>BEM-VINDO</h1>
        <div class="profile-card">
            
            <!-- Pré-visualização do Avatar Atual -->
            <div class="avatar-container">
                <img id="avatar-preview" src="presave.png" alt="Avatar">
            </div>

            <span class="label-secao">Usar avatar padrão:</span>
            
            <!-- Somente o presave.png como pré-seleção rápida -->
            <div class="preset-avatars">
                <img src="presave.png" onclick="setAvatar(this.src)" alt="Avatar Padrão" title="Clique para usar">
            </div>

            <span class="label-secao" style="margin-top: 5px;">Ou escolha da galeria do celular:</span>
            
            <!-- Botão dedicado para abrir os arquivos/galeria do celular -->
            <label class="btn-galeria">
                📂 Abrir arquivos do celular
                <input type="file" id="gallery-input" accept="image/*" style="display: none;">
            </label>

            <input type="text" id="username-input" placeholder="Seu Nome" value="Usuário">

            <button class="btn-entrar" onclick="entrarApp()">Entrar</button>
        </div>
    </div>

    <!-- TELA 2: APLICAÇÃO DE LANÇAMENTOS -->
    <div id="app-screen">
        <div class="header-top">
            <div class="user-greeting">
                <img id="header-avatar" src="" alt="User">
                <span id="header-name"></span>
            </div>
            <button class="btn-trocar" onclick="trocarPerfil()">Trocar Perfil</button>
        </div>

        <h1>Próximos Lançamentos</h1>
        <div id="lancamentos-container"></div>
    </div>

    <script>
        let currentAvatar = "presave.png";

        window.addEventListener('DOMContentLoaded', () => {
            const savedName = localStorage.getItem('userName');
            const savedAvatar = localStorage.getItem('userAvatar');

            if (savedName && savedAvatar) {
                document.getElementById('username-input').value = savedName;
                currentAvatar = savedAvatar;
                document.getElementById('avatar-preview').src = currentAvatar;
                entrarApp();
            }
        });

        function setAvatar(src) {
            currentAvatar = src;
            document.getElementById('avatar-preview').src = src;
        }

        // Evento para capturar a foto escolhida nos arquivos do celular
        document.getElementById('gallery-input').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentAvatar = e.target.result;
                    document.getElementById('avatar-preview').src = currentAvatar;
                }
                reader.readAsDataURL(file);
            }
        });

        function entrarApp() {
            const name = document.getElementById('username-input').value.trim() || 'Usuário';

            localStorage.setItem('userName', name);
            localStorage.setItem('userAvatar', currentAvatar);

            document.getElementById('header-name').textContent = name;
            document.getElementById('header-avatar').src = currentAvatar;

            document.getElementById('profile-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'block';

            carregarLancamentos();
        }

        function trocarPerfil() {
            document.getElementById('app-screen').style.display = 'none';
            document.getElementById('profile-screen').style.display = 'flex';
        }

        let dadosCarregados = false;
        function carregarLancamentos() {
            if (dadosCarregados) return;
            dadosCarregados = true;

            fetch('lancamentos.json')
                .then(response => response.json())
                .then(data => {
                    data.reverse();
                    const container = document.getElementById('lancamentos-container');

                    data.forEach(item => {
                        const card = document.createElement('div');
                        card.className = 'card';

                        const dataBruta = item.data.split(' ')[0];
                        let dataFormatada = dataBruta;

                        if (dataBruta.includes('-')) {
                            const [year, month, day] = dataBruta.split('-');
                            dataFormatada = `${day}/${month}/${year}`;
                        }

                        card.innerHTML = `
                            <h3>${item.titulo}</h3>
                            <video src="${item.arquivo}" controls preload="metadata"></video>
                            <div class="data-lancamento">Data de lançamento: ${dataFormatada}</div>
                            <div class="timer"></div>
                        `;

                        container.appendChild(card);

                        const video = card.querySelector('video');
                        video.addEventListener('play', () => {
                            document.querySelectorAll('video').forEach(otherVideo => {
                                if (otherVideo !== video) {
                                    otherVideo.pause();
                                }
                            });
                        });

                        const timerElement = card.querySelector('.timer');
                        function updateTimer() {
                            let targetDate;

                            if (item.data.includes('/')) {
                                const [datePart, timePart] = item.data.split(' ');
                                const [day, month, year] = datePart.split('/');
                                targetDate = new Date(`${year}-${month}-${day}T${timePart || '00:00'}`);
                            } else {
                                targetDate = new Date(item.data.replace(' ', 'T'));
                            }

                            const now = new Date();
                            const diff = targetDate - now;

                            if (diff <= 0) {
                                timerElement.innerHTML = "Lançado!";
                                return;
                            }

                            const seconds = Math.floor((diff / 1000) % 60);
                            const minutes = Math.floor((diff / (1000 * 60)) % 60);
                            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
                            const days = Math.floor((diff / (1000 * 60 * 60 * 24)) % 30);
                            const months = Math.floor(diff / (1000 * 60 * 60 * 24 * 30));

                            let textoTempo = "Faltam: ";

                            if (months > 0) {
                                textoTempo += `${months}m ${days}d`;
                            } else if (days > 0) {
                                textoTempo += `${days}d ${hours}h`;
                            } else if (hours > 0) {
                                textoTempo += `${hours}h ${minutes}min`;
                            } else if (minutes > 0) {
                                textoTempo += `${minutes}min ${seconds}s`;
                            } else {
                                textoTempo += `${seconds}s`;
                            }

                            timerElement.innerHTML = textoTempo;
                        }

                        updateTimer();
                        setInterval(updateTimer, 1000);
                    });
                })
                .catch(error => console.error('Erro ao carregar os lançamentos:', error));
        }
    </script>
</body>
</html>
