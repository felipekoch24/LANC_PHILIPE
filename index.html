<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar Geek - Philipe</title>
    <style>
        body { 
            background-color: #0b0b0f; 
            color: #f0f0f0; 
            font-family: sans-serif; 
            padding: 20px; 
            max-width: 600px;
            margin: 0 auto;
        }
        header { 
            text-align: center; 
            margin-bottom: 30px; 
        }
        header h1 {
            color: #e50914;
            letter-spacing: 2px;
            font-size: 1.8rem;
        }
        .card { 
            background: #14141c; 
            border-radius: 12px; 
            overflow: hidden; 
            margin-bottom: 30px; 
            border: 1px solid #2a2a38; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        video { 
            width: 100%; 
            display: block; 
            background: #000;
        }
        .content { 
            padding: 20px; 
        }
        h2 { 
            color: #ffffff; 
            margin-bottom: 10px; 
            font-size: 1.2rem; 
        }
        .countdown {
            font-size: 0.9rem;
            color: #d4af37;
            margin-top: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>LANÇAMENTOS</h1>
    </header>

    <!-- Onde os cards vão aparecer automaticamente lendo o JSON -->
    <div id="feed-container"></div>

    <script>
        fetch('lancamentos.json')
            .then(response => response.json())
            .then(videos => {
                const container = document.getElementById('feed-container');
                
                videos.forEach((item, index) => {
                    const cardDiv = document.createElement('div');
                    cardDiv.className = 'card';
                    
                    cardDiv.innerHTML = `
                        <video controls playsinline>
                            <source src="${item.arquivo}" type="video/mp4">
                            Seu navegador não suporta vídeos.
                        </video>
                        <div class="content">
                            <h2>${item.titulo}</h2>
                            <div class="countdown" id="timer-${index}">Calculando...</div>
                        </div>
                    `;
                    
                    container.appendChild(cardDiv);

                    const targetDate = new Date(item.data).getTime();
                    const timerElement = document.getElementById(`timer-${index}`);

                    function updateTimer() {
                        const now = new Date().getTime();
                        const distance = targetDate - now;

                        if (distance < 0) {
                            timerElement.innerHTML = "📺 EM EXIBIÇÃO / JÁ ESTREOU!";
                            timerElement.style.color = "#4BB543"; // Verde indicando que já rolou
                            return;
                        }

                        const totalHours = Math.floor(distance / (1000 * 60 * 60));
                        const totalDays = Math.floor(totalHours / 24);
                        const months = Math.floor(totalDays / 30);
                        const days = totalDays % 30;
                        const hours = totalHours % 24;

                        let textoTempo = "Faltam: ";
                        if (months > 0) textoTempo += `${months}m `;
                        if (days > 0 || months > 0) textoTempo += `${days}d `;
                        textoTempo += `${hours}h`;

                        timerElement.innerHTML = textoTempo;
                    }

                    updateTimer();
                    setInterval(updateTimer, 1000);
                });
            })
            .catch(error => console.error('Erro ao carregar os lançamentos:', error));
    </script>

</body>
</html>
